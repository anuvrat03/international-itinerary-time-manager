<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Itinerary Timezone Converter</title>
    <style>
        /* CSS makes the page look modern and adds smooth transitions */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            color: #333; 
            
            /* Smooth fade animation when background image changes */
            transition: background-image 1.5s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* The central semi-transparent white card */
        .container { 
            max-width: 600px; 
            width: 100%; 
            background: rgba(255, 255, 255, 0.92); 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); 
            margin: auto;
        }

        h2 {
            color: #007BFF;
            font-size: 22px;
            margin-top: 0;
            text-align: center;
        }

        label { 
            font-weight: bold; 
            font-size: 14px; 
            display: block; 
            margin-top: 15px;
            margin-bottom: 5px;
            color: #444;
        }

        input[type="file"] { 
            width: 100%; 
            margin-bottom: 15px; 
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: white;
            box-sizing: border-box;
        }

        textarea { 
            width: 100%; 
            height: 130px; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px;
            background-color: #fafafa;
        }

        button { 
            background-color: #007BFF; 
            color: white; 
            border: none; 
            padding: 14px; 
            margin-top: 18px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%; 
            font-weight: bold;
        }

        .output { 
            margin-top: 20px; 
            padding: 15px; 
            background-color: #e3f2fd; 
            border: 1px solid #90caf9; 
            border-radius: 6px; 
            white-space: pre-wrap; 
            font-family: monospace; 
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✈️ International Itinerary Time Manager 🏙️</h2>
    
    <!-- Upload file section -->
    <label for="fileInput">Option 1: Upload a text file (.txt or itinerary document)</label>
    <input type="file" id="fileInput" onchange="loadFile(event)">

    <!-- Paste text section -->
    <label for="itineraryInput">Option 2: Or paste flight details/text below</label>
    <textarea id="itineraryInput" placeholder="Paste itinerary text here... e.g., Depart JFK @ 14:30 on 15 Nov"></textarea>
    
    <!-- Action button -->
    <button onclick="showLocalTime()">Show Current Local Time Info</button>

    <h3>Result:</h3>
    <!-- Output display box -->
    <div id="resultOutput" class="output">Your details will appear here...</div>
</div>

<script>
    // LIST OF BACKGROUND IMAGES (Airplane, Skyscrapers, Airport, Travel view)
    const images = [
        'https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?q=80&w=2070', // New York Skyscrapers
        'https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=2074', // Airplane in clouds
        'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2073', // Tropical beach destination
        'https://images.unsplash.com/photo-1512453979798-5ea266f8880c?q=80&w=2070'  // Dubai skyline
    ];

    let currentIndex = 0;

    // Function to rotate background images smoothly every 5 seconds
    function changeBackground() {
        document.body.style.backgroundImage = `url('${images[currentIndex]}')`;
        currentIndex = (currentIndex + 1) % images.length;
    }

    // Start background slider immediately
    changeBackground();
    setInterval(changeBackground, 5000); // Changes every 5000 milliseconds (5 seconds)

    // Read uploaded text file
    function loadFile(event) {
        let file = event.target.files[0];
        if (!file) return;

        let reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById("itineraryInput").value = e.target.result;
        };
        reader.readAsText(file);
    }

    // Convert button action
    function showLocalTime() {
        let userInput = document.getElementById("itineraryInput").value;
        let userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        let currentLocalTime = new Date().toLocaleString();

        let outputBox = document.getElementById("resultOutput");
        outputBox.innerHTML = "<strong>Your Local Time Zone:</strong> " + userTimeZone + 
                              "<br><strong>Current Local Time:</strong> " + currentLocalTime + 
                              "<br><br><strong>Itinerary Details:</strong><br>" + userInput;
    }
</script>

</body>
</html>
