<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Itinerary Timezone Converter</title>
    
    <!-- This helper library allows your web app to read PDF files smoothly -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            color: #333; 
            transition: background-image 1.5s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .container { 
            max-width: 600px; 
            width: 100%; 
            background: rgba(255, 255, 255, 0.92); 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); 
            margin: auto;
        }

        h2 { color: #007BFF; font-size: 22px; margin-top: 0; text-align: center; }
        label { font-weight: bold; font-size: 14px; display: block; margin-top: 15px; margin-bottom: 5px; color: #444; }

        input[type="file"] { 
            width: 100%; 
            margin-bottom: 15px; 
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: white;
            box-sizing: border-box;
        }

        textarea { 
            width: 100%; 
            height: 160px; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px;
            background-color: #fafafa;
        }

        button { 
            background-color: #007BFF; 
            color: white; 
            border: none; 
            padding: 14px; 
            margin-top: 18px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%; 
            font-weight: bold;
        }

        .output { 
            margin-top: 20px; 
            padding: 15px; 
            background-color: #e3f2fd; 
            border: 1px solid #90caf9; 
            border-radius: 6px; 
            white-space: pre-wrap; 
            font-family: monospace; 
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✈️ International Itinerary Time Manager 🏙️</h2>
    
    <!-- File Upload Section accepting PDF and Text files -->
    <label for="fileInput">Option 1: Upload Itinerary Files (PDF or Text)</label>
    <input type="file" id="fileInput" multiple accept=".pdf, .txt" onchange="loadMultipleFiles(event)">

    <!-- Paste or display area -->
    <label for="itineraryInput">Option 2: Or view/paste extracted text below</label>
    <textarea id="itineraryInput" placeholder="Upload your PDF tickets/itineraries above..."></textarea>
    
    <!-- Convert Button -->
    <button onclick="showLocalTime()">Show Current Local Time Info</button>

    <h3>Result:</h3>
    <div id="resultOutput" class="output">Your details will appear here...</div>
</div>

<script>
    // Tell PDF.js where to find its worker engine
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // Background Image Slider
    const images = [
        'https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?q=80&w=2070',
        'https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=2074',
        'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2073',
        'https://images.unsplash.com/photo-1512453979798-5ea266f8880c?q=80&w=2070'
    ];

    let currentIndex = 0;
    function changeBackground() {
        document.body.style.backgroundImage = `url('${images[currentIndex]}')`;
        currentIndex = (currentIndex + 1) % images.length;
    }
    changeBackground();
    setInterval(changeBackground, 5000);

    // Function to handle reading multiple PDF or TXT files smoothly
    async function loadMultipleFiles(event) {
        let files = event.target.files;
        if (!files || files.length === 0) return;

        let textArea = document.getElementById("itineraryInput");
        textArea.value = "Extracting text from files, please wait...\n\n";
        
        let combinedText = "";

        for (let i = 0; i < files.length; i++) {
            let file = files[i];
            combinedText += "=== File: " + file.name + " ===\n";

            // If the file is a PDF, extract plain text using pdf.js
            if (file.type === "application/pdf" || file.name.endsWith(".pdf")) {
                try {
                    let arrayBuffer = await file.arrayBuffer();
                    let pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    
                    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                        let page = await pdf.getPage(pageNum);
                        let textContent = await page.getTextContent();
                        let pageText = textContent.items.map(item => item.str).join(" ");
                        combinedText += pageText + "\n";
                    }
                } catch (error) {
                    combinedText += "[Could not read PDF text directly]\n";
                }
            } else {
                // If standard text file
                let text = await file.text();
                combinedText += text + "\n";
            }
            combinedText += "\n";
        }

        // Put clean extracted text into the text box without freezing
        textArea.value = combinedText;
    }

    // Function to display current time zone
    function showLocalTime() {
        let userInput = document.getElementById("itineraryInput").value;
        let userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        let currentLocalTime = new Date().toLocaleString();

        let outputBox = document.getElementById("resultOutput");
        outputBox.innerHTML = "<strong>Your Local Time Zone:</strong> " + userTimeZone + 
                              "<br><strong>Current Local Time:</strong> " + currentLocalTime + 
                              "<br><br><strong>Extracted Itinerary Details:</strong><br>" + userInput;
    }
</script>

</body>
</html>
